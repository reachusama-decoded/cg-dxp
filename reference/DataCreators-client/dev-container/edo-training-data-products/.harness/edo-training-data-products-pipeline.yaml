  variables:
  - name: ENVIRONMENT
    type: String
    description: |
      Environment override for manual runs. In trunk-based mode, each lane
      hardcodes its own environment (dev1, sqa1, prd1). This variable is
      retained for backward compatibility with manual pipeline executions.
    required: false
    value: <+input>.default(dev1)
  - name: TF_ACTION
    type: String
    description: The TF action that should be performed (ie plan, apply, etc)
    required: false
    value: <+input>.default(apply)
  - name: PIPELINE_MODE
    type: String
    description: |
      Execution mode for unified pipeline.
      - astro: run astro/IAC/image stages only
      - dab: run Databricks stages only
      - both: run all applicable stages (Databricks before astro deploy)
    required: false
    value: <+input>.default(both)
