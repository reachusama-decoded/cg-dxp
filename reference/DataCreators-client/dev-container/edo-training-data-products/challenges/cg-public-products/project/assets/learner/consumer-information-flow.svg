<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="740" viewBox="0 0 1600 740" role="img" aria-labelledby="title desc"><title id="title">Who consumes your data product?</title><desc id="desc">Fictional classroom roles in the CG investment-products context. Arrows show information, not money.</desc><rect width="100%" height="100%" fill="white"/><text x="54" y="78" font-family="Arial, DejaVu Sans, sans-serif" font-size="40" font-weight="700" fill="#12324B">Who consumes your data product?</text><text x="54" y="123" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#536879">Fictional classroom roles in the CG investment-products context. Arrows show information, not money.</text><rect x="54" y="185" width="450" height="252" rx="16" fill="#EFF6F8" stroke="#CBD9E2" stroke-width="2"/><text x="76" y="234" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#203548">Published product evidence</text><text x="76" y="279" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#203548">25 ETFs</text><text x="76" y="316" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#203548">65 Class F-3 fund offerings</text><text x="76" y="353" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#203548">19 SMA strategies</text><rect x="573" y="185" width="450" height="252" rx="16" fill="#EFF6F8" stroke="#CBD9E2" stroke-width="2"/><text x="595" y="234" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#203548">You: Data Creators</text><text x="595" y="279" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#203548">Agree PRD + contract</text><text x="595" y="316" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#203548">Build a traceable catalogue</text><text x="595" y="353" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#203548">Check comparisons + gaps</text><rect x="1092" y="185" width="454" height="252" rx="16" fill="#EFF6F8" stroke="#CBD9E2" stroke-width="2"/><text x="1114" y="234" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#203548">Internal consumer</text><text x="1114" y="279" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#203548">Product Information Analyst</text><text x="1114" y="316" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#203548">Supports sales / relationships</text><text x="1114" y="353" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#203548">Uses figures with source context</text><line x1="508" y1="305" x2="568" y2="305" stroke="#087F8C" stroke-width="4"/><polygon points="568,305 554.4932934647098,311.52448301166845 554.4932934647098,298.47551698833155" fill="#087F8C"/><line x1="1027" y1="305" x2="1087" y2="305" stroke="#087F8C" stroke-width="4"/><polygon points="1087,305 1073.49329346471,311.52448301166845 1073.49329346471,298.47551698833155" fill="#087F8C"/><rect x="1092" y="515" width="454" height="148" rx="16" fill="#EFF6F8" stroke="#CBD9E2" stroke-width="2"/><text x="1114" y="564" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#203548">Professional enquiry</text><text x="1114" y="609" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#203548">Financial professional / RIA</text><line x1="1319" y1="510" x2="1319" y2="442" stroke="#087F8C" stroke-width="4"/><polygon points="1319,442 1325.5244830116685,455.50670653529016 1312.4755169883315,455.50670653529016" fill="#087F8C"/><rect x="54" y="515" width="969" height="148" rx="16" fill="#F6F8FA" stroke="#CBD9E2" stroke-width="2"/><text x="78" y="570" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#203548">The internal analyst is your direct data consumer.</text><text x="78" y="614" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#203548">Missing evidence becomes a review reason, not an invented value.</text></svg>