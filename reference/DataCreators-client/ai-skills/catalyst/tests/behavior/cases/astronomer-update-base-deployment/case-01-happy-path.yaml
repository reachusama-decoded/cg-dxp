# Validation evidence:
# - Offline suite: 1,349 passed.
# - Overlay exercise: local template-root/target fixture, dry-run mode; apply
#   was not used because this case verifies the no-write safety boundary.
# Dry run completed against itg-ig-tech-imt-csgd-data-products.
#    Detected Airflow 3
#    Template SHA: d8c31677d5e6385d82b6c9c0c66a42ef618a409c
#    5 files would be added
