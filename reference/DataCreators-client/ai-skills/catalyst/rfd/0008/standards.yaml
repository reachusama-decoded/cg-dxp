# RFD 0008 Coding Standards — Rule Index
#
# This file is the machine-readable index of every rule defined in RFD 0008.
# Rule IDs are stable: deprecated rules stay in place with status: deprecated
# and a "replaced_by" pointer. They never get renumbered or reused.
#
# Used by:
#   - Future engineering skills binding to specific rules via metadata.standards
#   - CI gates mapping rule IDs to linter configurations
#   - Dashboards aggregating compliance and exception trends
#
# Schema per rule:
#   id:          PY-NAMING-001 (LANG-CATEGORY-NNN)
#   title:       one-line directive (matches the markdown heading)
#   language:    python | rust | java | typescript | common
#   category:    one of the categories defined per language
#   severity:    error | warning | advisory
#   since:       version when added (semver)
#   linter:      list of enforcing linter rule codes, or "advisory"
#   source:      relative path + heading anchor in the markdown

version: 0.1.0

rules:

