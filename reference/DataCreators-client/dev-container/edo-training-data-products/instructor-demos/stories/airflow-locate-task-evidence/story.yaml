requires:
- browser
- env:DC_ASTRO_STAGE
- env:DC_SUCCESS_RUN
- env:DC_FAILURE_RUN
- env:DC_REPAIR_RUN
- env:DC_SESSION_STARTED_AT
- env:DC_AIRFLOW_API_URL
- env:DC_AIRFLOW_API_TOKEN
- env:DEMO_AIRFLOW_RUN_URL
- env:DEMO_AIRFLOW_LOG_URL
- env:DEMO_BROWSER_STATE
resources:
- owned Astro DAG/stage
- owned Databricks relations
cleanup: []
main_book:
  include: false
  teaching_key: airflow-run-and-recovery
steps:
- id: scheduled-evidence
  action:
    adapter: terminal
    session: developer
    command: python3 runtime/check-scheduled.py "$DC_ASTRO_STAGE" --success "$DC_SUCCESS_RUN"
      --failure "$DC_FAILURE_RUN" --repair "$DC_REPAIR_RUN" --after "$DC_SESSION_STARTED_AT"
  expect:
    exit_code: 0
    checks:
    - kind: output-contains
      text: fresh scheduled success
  capture:
    context: ASTRO SCHEDULED WORKER -> DATABRICKS
    hold_seconds: 3
  caption:
    action: Inspect the three exact scheduled run identities and warehouse-bound receipts.
    notice: A failed quality gate blocks publication evidence. Actual graph/grid/log
      framing and recovery pacing must be completed on the live UI.
- id: fresh-run-ui
  action:
    adapter: browser
    verb: navigate
    url: '{{env.DEMO_AIRFLOW_RUN_URL}}'
  expect:
    exit_code: 0
    checks:
    - kind: output-contains
      text: publication_evidence
  capture:
    context: ASTRO / OWNED FRESH SCHEDULED RUN
    hold_seconds: 3
  caption:
    action: Inspect graph/grid for the API-verified owned run.
    notice: Use a prepared signed-in browser state outside recording. The URL must
      bind the exact success or repair run ID.
- id: quality-failure-log
  action:
    adapter: browser
    verb: navigate
    url: '{{env.DEMO_AIRFLOW_LOG_URL}}'
  expect:
    exit_code: 0
    checks:
    - kind: output-contains
      text: Intentional Portfolio quality drill
  capture:
    context: ASTRO / FAILED QUALITY TASK LOG
    hold_seconds: 3
  caption:
    action: Read the intended quality failure log.
    notice: Bind the log URL to the exact failed scheduled run; downstream publication_evidence
      is blocked. Human readability and pacing remain pending.
closing_question: Show the fresh scheduled task identity, independent business output
  and failure/repair evidence; explain why a green historical grid is insufficient.
