v2_training:
  target: local
  outputs:
    local:
      type: duckdb
      path: "{{ env_var('V2_DB_PATH', 'training.duckdb') }}"
      schema: main
      threads: 1
    databricks:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST', 'unused') }}"
      http_path: "{{ env_var('DBT_HTTP_PATH', 'unused') }}"
      catalog: "{{ env_var('DBT_CATALOG', 'training_dev') }}"
      schema: "{{ env_var('V2_DB_SCHEMA', 'must_be_provisioned') }}"
      token: "{{ env_var('DBT_ACCESS_TOKEN', 'MISSING_run__mise_run_setup_databricks') }}"
      connection_parameters:
        _disable_pandas: true
      threads: 1
