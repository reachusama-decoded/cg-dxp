# data_products/{{PRODUCT}}/datasets/{{DATASET}}/bundle/{{DATASET}}.job.yml
# Generated by /setup-databricks-asset-bundle — DO NOT HAND-EDIT
# Catalyst-version: 2 (per-product / datasets-bundle layout)
#
# Main dbt-run job for the {{DATASET}} dataset. Single task that invokes
# `dbt_wrapper.py deps_then_run` so deps + run share the same Python
# process.
#
# Companion: {{DATASET}}_dq.job.yml — separate Deequ DQ verification job.
#
# Note on quoting: the job key and `name:` are double-quoted so the
# unrendered template parses as valid YAML (a bare `{{DATASET}}_job:`
# mapping key is a parse error). The renderer can re-key in the final
# emission if desired, but quoted keys are equally valid YAML and the
# Databricks CLI accepts them.
#
# RFD 0012 deviations still pending (TODO when the team adopts them):
# - DBX-BUNDLE-007 (tags: data_product / owner / cost_center)
# - DBX-BUNDLE-008 (explicit permissions: block)
# - DBX-DAB-001 / DBX-DAB-004 (databricks_job_prefix for compose
#   with /generate-dag). Today the job name is literal; uncomment the
#   prefix form once /generate-dag's compose contract is wired here.
# - DBX-DAB-003 is enforced here: do not emit email_notifications blocks.
#   Failure alerting is platform-side (Astronomer Datadog), not a DAG callback.

resources:
  jobs:
    "{{DATASET}}_job":
      name: "{{DATASET}}_job"                  # TODO DBX-DAB-001: "${var.databricks_job_prefix}{{DATASET}}_job"
      tasks:
        # Human-facing alerting is platform-side (Astronomer Datadog), not a DAG callback.
        - task_key: dbt_run
          spark_python_task:
            python_file: ${workspace.root_path}/files/dbt_wrapper.py
            parameters:
              - deps_then_run                  # runs `dbt deps` then `dbt run` in one process
              - --debug
              - run
              - --project-dir
              - ${workspace.root_path}/files/data_products/${var.data_product_name}
              - --profiles-dir
              - ${workspace.root_path}/files/data_products/${var.data_product_name}/dbt_profiles
              - --select
              - "+{{DATASET}}+"
              - --target=${bundle.target}
              - --target-path
              - ${var.dbt_state_path}
              # --vars below: dbt expects a YAML/JSON mapping as ONE arg. Wrapped
              # in single quotes to make YAML emit a literal string; inner single
              # quotes are doubled (YAML escape for a single quote inside a
              # single-quoted scalar). Any var rename here must keep both the
              # outer wrapping and the doubled-quote escaping intact.
              - --vars
              - '{catalog: ''${var.app_catalog}'', schema: ''${var.target_schema}'', target_schema: ''${var.target_schema}'', http_path: ''${var.http_path}'', checkpoint_table: ''${var.checkpoint_table}'', app_catalog: ''${var.app_catalog}'', caspian_catalog: ''${var.caspian_catalog}'', domain_catalog: ''${var.domain_catalog}''}'
          existing_cluster_id: ${var.cluster_id}   # DBX-DAB-005 — persistent compute referenced by var only
