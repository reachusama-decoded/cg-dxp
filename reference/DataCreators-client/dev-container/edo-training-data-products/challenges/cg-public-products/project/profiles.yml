# Uses fresh credentials prepared by the course; this file stores no secrets.
cg_capstone:
  target: training
  outputs:
    training:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') | replace('https://', '') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      catalog: "{{ env_var('DBT_CATALOG') }}"
      schema: "{{ env_var('DBT_SCHEMA') }}"
      token: "{{ env_var('DBT_ACCESS_TOKEN') }}"
      threads: 1
      connection_parameters:
        _disable_pandas: true
