# data_products/{{PRODUCT}}/databricks.yml
# Generated by /setup-databricks-asset-bundle — DO NOT HAND-EDIT
# Catalyst-version: 2 (per-product / datasets-bundle layout)
#
# Bundle root for the {{PRODUCT}} data product. One bundle per product
# (DBX-BUNDLE-002). Bundle name matches the data product name so paths and
# job names compose cleanly.
#
# Aspirational gaps still pending (RFD 0012 — not yet enforced here):
# - DBX-BUNDLE-003 — workspace.host is still inline per target; eventual
#   move is to read from promotions.yml.
# - DBX-BUNDLE-007 — job-level tags (data_product / owner / cost_center)
#   not yet emitted on per-dataset jobs.
# - DBX-BUNDLE-008 — permissions block not yet emitted.
# - DBX-DAB-001 / DBX-DAB-004 — databricks_job_prefix var is
#   commented-in-spirit (jobs are named literally today; can opt in once
#   /generate-dag's compose contract is wired across all products).
#
# Note on quoting: every `<<PLACEHOLDER>>` value below is double-quoted
# so the unrendered template parses as valid YAML. The renderer strips
# the surrounding quotes when substituting URLs / IDs that shouldn't be
# emitted as quoted strings.

bundle:
  name: "{{PRODUCT}}"                          # DBX-BUNDLE-001 — bundle name = product
  # Keep the upper bound strictly pre-1.0.0 so a future 1.x schema/behavior
  # change cannot silently alter generation semantics.
  databricks_cli_version: ">= 0.218.0, < 1.0.0"

# `include` globs auto-discover dataset bundle files; adding a new dataset
# requires no edits here. Variable declarations and cluster-shape definitions
# are loaded globally. Per-environment values are set in each target's
# `variables:` block (target-level `include` is not used).
include:
  - "datasets/**/bundle/*.yml"
  - variables/variables.yml
  - variables/clusters.yml

# Sync ships the dbt project + shared helpers into the workspace alongside
# the bundle. Airflow + contract directories are excluded — those aren't
# Databricks-deployable.
sync:
  paths:
    - .
    - ../../dbt_wrapper.py
    - ../../shared
    - ./dbt_profiles
    - ./dbt_project.yml
    - ./packages.yml
    - ./requirements.txt
    - ./init_scripts
    - ./dbt_packages
    - ../.blueprints/src
  # `./dbt_packages` in `paths:` ships local dbt_packages content; the
  # `**/dbt_packages/**` exclude below filters nested dbt_packages directories
  # within `shared/` (or other synced trees) — these don't conflict.
  exclude:
    - "**/airflow/**"
    - "**/contract/**"
    - "**/dbt_packages/**"

# Targets cover local (per-user dev space) and the shared dev / sqa / prd
# environments + their DR variants. Promotion path: local -> dev (deploy only
# when you need to share) -> sqa -> prd. New targets follow the same shape —
# set host + per-target variable overrides.
targets:
  local:
    default: true
    mode: development
    workspace:
      host: "https://{{DEV_WORKSPACE_HOST}}"   # DBX-BUNDLE-003 (aspirational) — eventual move: read from promotions.yml
      # profile: {{DEV_PROFILE}}                # uncomment + replace with your CLI profile name to use ~/.databrickscfg auth instead of an inline host
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      env: local
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
      http_path: "{{DEV_SQL_WAREHOUSE_HTTP_PATH}}"
      sql_warehouse_id: "{{DEV_SQL_WAREHOUSE_ID}}"
      cluster_id: "{{DEV_CLUSTER_ID}}"
      default_catalog: "{{DEV_DEFAULT_CATALOG}}"
      caspian_catalog: "{{DEV_CASPIAN_CATALOG}}"
      app_catalog: "{{DEV_APP_CATALOG}}"
      target_schema: ${workspace.current_user.short_name}
      checkpoint_table: "{{DEV_APP_CATALOG}}.${workspace.current_user.short_name}.standard_dataset_checkpoints"
      # Per-user UC Volume path (matches the real edo-ig-data-products
      # shape). `/tmp` doesn't work on shared clusters where the dir is
      # owned by an earlier user — UC Volumes give each user a writable
      # namespace. The `zz_` prefix marks this as user-scoped to keep it
      # out of normal-schema listings.
      dbt_state_path: /Volumes/${var.app_catalog}/cspn_sys/dbt_state/zz_${workspace.current_user.short_name}

  dev:
    workspace:
      host: "https://{{DEV_WORKSPACE_HOST}}"
      root_path: /Workspace/${var.project_name}/${var.app_name}/.bundle/${bundle.name}/${bundle.target}
    variables:
      env: dev
      root_path: /Workspace/${var.project_name}/${var.app_name}/.bundle/${bundle.name}/${bundle.target}
      http_path: "{{DEV_SQL_WAREHOUSE_HTTP_PATH}}"
      sql_warehouse_id: "{{DEV_SQL_WAREHOUSE_ID}}"
      kafka_secret_scope: "{{DEV_KAFKA_SECRET_SCOPE}}"
      kafka_secret_arn: "{{DEV_KAFKA_SECRET_ARN}}"
      rootca_secret_arn: "{{DEV_ROOTCA_SECRET_ARN}}"
      data_notify_topic: "{{DEV_DATA_NOTIFY_TOPIC}}"
      bootstrap_brokers: "{{DEV_MSK_BOOTSTRAP_BROKERS}}"
      schema_registry_url: "{{DEV_SCHEMA_REGISTRY_URL}}"
      zone_bucket: "{{DEV_ZONE_BUCKET}}"
      util_bucket: "{{DEV_UTIL_BUCKET}}"
      default_catalog: "{{DEV_DEFAULT_CATALOG}}"
      default_schema: "{{DEV_DEFAULT_SCHEMA}}"
      cluster_id: "{{DEV_CLUSTER_ID}}"
      caspian_catalog: "{{DEV_CASPIAN_CATALOG}}"
      app_catalog: "{{DEV_APP_CATALOG}}"
      target_schema: ${workspace.current_user.short_name}
      checkpoint_table: "{{DEV_APP_CATALOG}}.{{DEV_CHECKPOINT_SCHEMA}}.{{CHECKPOINT_TABLE_NAME}}"

  sqa:
    workspace:
      host: "https://{{SQA_WORKSPACE_HOST}}"
      root_path: /Workspace/${var.project_name}/${var.app_name}/.bundle/${bundle.name}/${bundle.target}
