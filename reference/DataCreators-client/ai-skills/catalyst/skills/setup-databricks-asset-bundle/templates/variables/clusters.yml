# data_products/{{PRODUCT}}/variables/clusters.yml
# Generated by /setup-databricks-asset-bundle
# Catalyst-version: 2 (per-product / datasets-bundle layout)
#
# Cluster shapes declared as `complex` variables so per-dataset jobs can
# reference them inline via `${var.small_cluster}` / `${var.dqf_cluster}`
# without duplicating Spark config.
#
# RFD 0012 status:
# - DBX-BUNDLE-004 — "no inline node_type_id" is aspirational; today
#   each cluster shape inlines `node_type_id`. Until a shared compute.yml
#   exists, treat this file as the per-product cluster catalog.
# - DBX-BUNDLE-009 — Spark version is LTS (15.4.x-scala2.12). Bump LTS
#   versions across products synchronously; never inline preview channels
#   in prd / sqa targets.

variables:
  small_cluster:
    description: "Small autoscaling cluster — default for dbt tasks"
    type: complex
    default:
      spark_version: ${var.databricks_runtime_spark_version}
      spark_env_vars:
        PROJECT_HOME: ${var.root_path}/files
        PYTHONPATH: ${var.root_path}/files:${var.root_path}/files/shared:${var.root_path}/files/data_products/${var.data_product_name}/python
        DBT_TARGET_PATH: ${var.root_path}/files/data_products/${var.data_product_name}/target
        DBT_HOST: ${workspace.host}
        GIT_SSL_NO_VERIFY: "true"
        REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
        SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
        CURL_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
        GIT_SSL_CAINFO: /etc/ssl/certs/ca-certificates.crt
      policy_id: ${var.compute_policy_id}
      node_type_id: m7gd.large
      autoscale:
        min_workers: 1
        max_workers: 2
      data_security_mode: SINGLE_USER
      init_scripts:
        - workspace:
            destination: ${var.root_path}/files/data_products/${var.data_product_name}/init_scripts/install_requirements.sh

  dqf_cluster:
    description: "Single-node cluster for Deequ-based DQ verification jobs"
    type: complex
    default:
      spark_version: "15.4.x-scala2.12"        # DBX-BUNDLE-009 — LTS pin
      spark_env_vars:
        PROJECT_HOME: ${var.root_path}/files
        PYTHONPATH: ${var.root_path}/files:${var.root_path}/files/shared:${var.root_path}/files/data_products/${var.data_product_name}/python
        DBT_HOST: ${workspace.host}
        DEFAULT_CATALOG: ${var.default_catalog}
        DEFAULT_SCHEMA: ${var.default_schema}
        GIT_SSL_NO_VERIFY: "true"
      policy_id: ${var.compute_policy_id}
      node_type_id: m7gd.large
      num_workers: 0
      data_security_mode: SINGLE_USER
      spark_conf:
        spark.master: "local[*]"
        spark.databricks.cluster.profile: "singleNode"
      custom_tags:
        ResourceClass: "SingleNode"
      init_scripts:
        - workspace:
            destination: ${var.root_path}/files/data_products/${var.data_product_name}/init_scripts/install_dqf_requirements.sh
