<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc"><title id="title">A diagnostic event is not a release gate</title><desc id="desc">Data Creator orientation: build a candidate separately; only a passed gate can change accepted output.</desc><rect width="100%" height="100%" fill="white"/><text x="54" y="78" font-family="Arial, DejaVu Sans, sans-serif" font-size="40" font-weight="700" fill="#12324B">A diagnostic event is not a release gate</text><text x="54" y="123" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#536879">Data Creator orientation: build a candidate separately; only a passed gate can change accepted output.</text><rect x="54" y="180" width="340" height="205" rx="16" fill="#EFF6F8" stroke="#CBD9E2" stroke-width="2"/><text x="76" y="229" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#203548">Candidate</text><text x="76" y="274" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#203548">Separate temporary output</text><text x="76" y="311" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#203548">Build + validate</text><rect x="452" y="180" width="340" height="205" rx="16" fill="#EFF6F8" stroke="#CBD9E2" stroke-width="2"/><text x="474" y="229" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#203548">Quality gate</text><text x="474" y="274" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#203548">Pass → accept</text><text x="474" y="311" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#203548">Fail → block receipt</text><rect x="850" y="180" width="696" height="205" rx="16" fill="#EFF6F8" stroke="#CBD9E2" stroke-width="2"/><text x="872" y="229" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#203548">Accepted consumer view</text><text x="872" y="274" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#203548">Point only to a validated candidate</text><text x="872" y="311" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#203548">A failed candidate leaves this unchanged</text><line x1="398" y1="279" x2="447" y2="279" stroke="#087F8C" stroke-width="4"/><polygon points="447,279 433.49329346470984,285.52448301166845 433.49329346470984,272.47551698833155" fill="#087F8C"/><line x1="797" y1="279" x2="845" y2="279" stroke="#087F8C" stroke-width="4"/><polygon points="845,279 831.4932934647098,285.52448301166845 831.4932934647098,272.47551698833155" fill="#087F8C"/><rect x="452" y="479" width="450" height="144" rx="16" fill="#EFF6F8" stroke="#CBD9E2" stroke-width="2"/><text x="474" y="528" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#203548">Failure callback</text><text x="474" y="573" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#203548">Save an event without sensitive text</text><line x1="622" y1="390" x2="622" y2="470" stroke="#8A5200" stroke-width="4"/><polygon points="622,470 615.4755169883315,456.49329346470984 628.5244830116685,456.49329346470984" fill="#8A5200"/><text x="54" y="672" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#203548">Observation helps diagnose a failure. Dependency/trigger rules determine whether publication is safe.</text></svg>