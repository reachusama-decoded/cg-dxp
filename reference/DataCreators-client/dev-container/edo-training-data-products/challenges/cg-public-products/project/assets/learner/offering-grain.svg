<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc"><title id="title">Keep one catalogue row per offering</title><desc id="desc">One offering can have several return figures with different methods, periods, dates and sources.</desc><rect width="100%" height="100%" fill="white"/><text x="54" y="78" font-family="Arial, DejaVu Sans, sans-serif" font-size="40" font-weight="700" fill="#12324B">Keep one catalogue row per offering</text><text x="54" y="123" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#536879">One offering can have several return figures with different methods, periods, dates and sources.</text><rect x="54" y="180" width="450" height="230" rx="16" fill="#EFF6F8" stroke="#CBD9E2" stroke-width="2"/><text x="76" y="229" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#203548">Source representations</text><text x="76" y="274" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#203548">Catalogue + detail layers</text><text x="76" y="311" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#203548">Multiple fee components</text><text x="76" y="348" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#203548">Multiple return observations</text><rect x="573" y="180" width="450" height="230" rx="16" fill="#EFF6F8" stroke="#CBD9E2" stroke-width="2"/><text x="595" y="229" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#203548">Required source selection</text><text x="595" y="274" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#203548">25 ETF / 65 F3 / 19 SMA IDs</text><text x="595" y="311" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#203548">Choose fee layer/component</text><text x="595" y="348" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#203548">Check return method and dates</text><rect x="1092" y="180" width="454" height="230" rx="16" fill="#EFF6F8" stroke="#CBD9E2" stroke-width="2"/><text x="1114" y="229" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#203548">Consumer catalogue</text><text x="1114" y="274" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#203548">One row per scoped ID</text><text x="1114" y="311" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#203548">Preserve unknown values</text><text x="1114" y="348" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#203548">Explain comparison limits</text><line x1="508" y1="295" x2="568" y2="295" stroke="#087F8C" stroke-width="4"/><polygon points="568,295 554.4932934647098,301.52448301166845 554.4932934647098,288.47551698833155" fill="#087F8C"/><line x1="1027" y1="295" x2="1087" y2="295" stroke="#087F8C" stroke-width="4"/><polygon points="1087,295 1073.49329346471,301.52448301166845 1073.49329346471,288.47551698833155" fill="#087F8C"/><rect x="54" y="483" width="1492" height="154" rx="16" fill="#FFF8EA" stroke="#DEC99C" stroke-width="2"/><text x="78" y="537" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#8A5200">Gotcha: product × every fee × every return multiplies rows; DISTINCT does not restore lost meaning.</text><text x="78" y="583" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#203548">Keep detailed evidence separate. Add one selected return only when the comparison rules allow it.</text></svg>