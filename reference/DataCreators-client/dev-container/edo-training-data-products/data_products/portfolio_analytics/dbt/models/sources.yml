version: 2

# These four sources are raw Delta tables in your training schema. Provision them
# with `mise run challenge:seed 02` — they are the same feeds challenge 02 builds
# on, so its seed step lands them in your schema (`training_dev.training_<username>`,
# the same schema dbt builds into) with a fresh `_extracted_at` so the freshness
# gate passes. Staging reads them through source(), exactly as it would read a
# real custodian or Bloomberg feed landed by an upstream ingestion job.
#
# Each source pins database/schema to the dbt target, so source('custodian',
# 'holdings_raw') resolves to training_dev.training_<username>.holdings_raw.

sources:
  - name: custodian
    database: "{{ target.database }}"
    schema: "{{ target.schema }}"
    description: "Daily SFTP drop from the custodian: position-level holdings and cash."
    config:
      loaded_at_field: _extracted_at
      freshness:
        warn_after:  {count: 4, period: hour}
        error_after: {count: 6, period: hour}
    tables:
      - name: holdings_raw
        description: "Position-level holdings per fund per day."
        columns:
          - name: fund_cd
          - name: pos_dt
          - name: isin
          - name: qty
          - name: mkt_val_lc
          - name: ccy_cd
      - name: positions_raw
        description: "Cash + accrued positions per fund per day."

  - name: bloomberg
    database: "{{ target.database }}"
    schema: "{{ target.schema }}"
    description: "Daily reference data + end-of-day prices."
    config:
      loaded_at_field: _extracted_at
      freshness:
        warn_after:  {count: 8, period: hour}
        error_after: {count: 24, period: hour}
    tables:
      - name: prices_raw
      - name: refdata_raw

  - name: fx_feed
    database: "{{ target.database }}"
    schema: "{{ target.schema }}"
    description: "Daily FX close rates to a GBP base."
    config:
      loaded_at_field: _extracted_at
      freshness:
        warn_after:  {count: 6, period: hour}
        error_after: {count: 12, period: hour}
    tables:
      - name: fx_rates_raw

  - name: product_ref
    database: "{{ target.database }}"
    schema: "{{ target.schema }}"
    description: "Internal fund master + product catalogue."
    tables:
      - name: fund_master_raw
