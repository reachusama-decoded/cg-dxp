# data_products/{{PRODUCT}}/variables/variables.yml
# Generated by /setup-databricks-asset-bundle — DO NOT HAND-EDIT
# Catalyst-version: 2 (per-product / datasets-bundle layout)
#
# Bundle-wide variable declarations. Per-env overrides live inline in
# `databricks.yml#targets.<env>.variables:` (DAB schema does not allow
# per-target `include:`); `variables_<env>.yml` files mirror those values
# as scaffolding for the real envs. Cluster-shape variables live in
# clusters.yml.
#
# Note on quoting: every `<<PLACEHOLDER>>` default is wrapped in double
# quotes so the unrendered template parses as valid YAML (a bare
# `default: <<X>>` would be read as a flow mapping). The renderer can
# strip the quotes from defaults that should be unquoted in the final
# file (e.g. numeric defaults) at substitution time.

variables:
  env:
    description: "Environment Name (target name, e.g. dev / sqa / prd)"
    default: "local"
  project_name:
    description: "Name of the Project"
    default: "{{PROJECT_NAME}}"
  project_team:
    description: "Project Team name"
    default: "{{PROJECT_TEAM}}"
  atm_id:
    description: "ATM_ID (Capital Group app registration)"
    default: "{{ATM_ID}}"
  app_name:
    description: "Name of the Application"
    default: "{{APP_NAME}}"
  data_product_name:
    description: "Name of the data product (matches bundle.name and dbt project name)"
    default: "{{PRODUCT}}"
  root_path:
    description: "Root workspace path for artifacts deployment"
    default: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
  cluster_id:
    # Empty default by design: every target's `variables:` block must set
    # this. A missing override fails loud at deploy (`cluster_id not set`)
    # rather than silently leaking a dev cluster into a prd deploy.
    description: "Existing Databricks cluster ID for job runs (set per target in databricks.yml#targets.<env>.variables; mirrored in variables_<env>.yml)"
    default: ""
  shared_init_scripts_location:
    description: "Shared location for init scripts"
    default: /Workspace/databricks/shared_init

  # Cluster sizing knobs — referenced by clusters.yml
  instance_pools:
    description: "Instance pool IDs by T-shirt size"
    type: complex
    default:
      instance_pool_s: ""
      instance_pool_m: ""
      instance_pool_l: ""
      instance_pool_xl: ""
  compute_policy_id:
    description: "Compute Policy ID (set per env where required)"
    default: ""
  databricks_runtime_spark_version:
    description: "Databricks Runtime Spark Version (LTS — DBX-BUNDLE-009)"
    default: "15.4.x-scala2.12"

  # SQL warehouse + catalogs — populated per env in databricks.yml#targets.<env>.variables (mirrored in variables_<env>.yml)
  http_path:
    description: "SQL Warehouse HTTP Connection"
    default: ""
  sql_warehouse_id:
    description: "SQL Warehouse ID for dbt tasks"
    default: ""
  default_catalog:
    # Empty default; set per target. Avoids dev-catalog leak into non-dev deploys.
    description: "Default Catalog for dbt task"
    default: ""
  default_schema:
    description: "Default schema for dbt task"
    default: ${workspace.current_user.short_name}
  target_schema:
    description: "Target schema for dbt profile and model writes"
    default: ""
  checkpoint_table:
    # Empty default; set per target. Avoids prd writes landing in a dev
    # checkpoint table when an override is forgotten.
    description: "Checkpoint table used by Caspian macros"
    default: ""

  # Caspian / domain catalogs — empty defaults; set per target.
  caspian_catalog:
    description: "Application/source catalog for reading source data"
    default: ""
  app_catalog:
    description: "Caspian IG catalog for writing data product output"
    default: ""
  domain_catalog:
    description: "Domain catalog for domain-aligned tables (optional)"
    default: ""

  # DQF / Deequ
  dev_test_mode:
    description: "Test mode: local_dbt | cluster_user_schema | cluster_dev_schema"
    default: "cluster_user_schema"
  dbt_state_path:
    description: "Path for dbt artifacts (partial_parse, run_results, manifest). Default is a UC Volume for persistence across runs; per-target overrides (e.g. local) can point at /tmp for ephemeral dev."
    default: /Volumes/${var.app_catalog}/cspn_sys/dbt_state
  deequ_jar_path:
    description: "Path to Deequ JAR in Unity Catalog Volumes"
    default: /Volumes/${var.default_catalog}/${var.default_schema}/dqf_libs/deequ-2.0.16-spark-3.5.jar

  # Kafka / data-ready notification
  zone_bucket:
    description: "S3 zone bucket for data notify"
    default: ""
  util_bucket:
    description: "S3 bucket used by utility tasks that publish xcom and sidecar artifacts"
    default: ""
  data_notify_topic:
    description: "Kafka topic for data notifications"
    default: ""
  kafka_secret_scope:
    description: "Databricks secret scope for Kafka credentials (MSK user + root CA) — DEPRECATED: use kafka_secret_arn instead"
    default: ""
  kafka_secret_arn:
    description: "AWS Secrets Manager ARN for Kafka credentials (username/password). Overridden per env."
    default: ""
  rootca_secret_arn:
    description: "AWS Secrets Manager ARN for Kafka root CA certificate. Overridden per env."
    default: ""
  bootstrap_brokers:
    description: "MSK bootstrap broker list"
    default: ""
  schema_registry_url:
    description: "Confluent Schema Registry URL"
    default: ""
  aws_region:
    description: "AWS region"
    default: "us-east-1"

  # Misc
  git_branch:
    description: "Current git branch — informational"
    default: ""
