      util_bucket: "{{SQA_UTIL_BUCKET}}"
      default_catalog: "{{SQA_DEFAULT_CATALOG}}"
      default_schema: "{{SQA_DEFAULT_SCHEMA}}"
      cluster_id: "{{SQA_CLUSTER_ID}}"
