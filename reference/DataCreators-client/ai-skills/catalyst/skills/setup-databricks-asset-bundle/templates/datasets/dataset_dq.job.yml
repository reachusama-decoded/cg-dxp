# data_products/{{PRODUCT}}/datasets/{{DATASET}}/bundle/{{DATASET}}_dq.job.yml
# Generated by /setup-databricks-asset-bundle — DO NOT HAND-EDIT
# Catalyst-version: 2 (per-product / datasets-bundle layout)
#
# Deequ data-quality verification job for {{DATASET}}. Runs as a notebook
# task (the deequ verify notebook lives under the dataset's runtime/
# directory) against a single-node `dqf_cluster` ephemeral job_cluster
# (DBX-DAB-007 — ephemeral per-job clusters allowed).
#
# Pairs with {{DATASET}}.job.yml. Airflow orchestrates ordering; this job
# is a sibling, not a downstream task.
#
# Notebook source requirement: the skill checks for
# `data_products/{{PRODUCT}}/datasets/{{DATASET}}/runtime/dq_verify.py`
# at emit time. If absent, the emission carries a `# TODO: author
# runtime/dq_verify.py before deploy` marker at the top and the skill
# surfaces a warning to the user. See `references/dq-jobs.md`.

resources:
  jobs:
    "{{DATASET}}_dq_job":
      name: "{{DATASET}}_dq_job"
      tasks:
        # Human-facing alerting is platform-side (Astronomer Datadog), not a DAG callback.
        - task_key: deequ_verify_task
          notebook_task:
            notebook_path: ${workspace.root_path}/files/data_products/${var.data_product_name}/datasets/{{DATASET}}/runtime/dq_verify
            base_parameters:
              application_name: "{{DQ_APPLICATION_NAME}}"
              dataset_name: "{{DATASET_RULESET_DATASET_NAME}}"
              ruleset_name: "{{DATASET_RULESET_NAME}}"
              rule_group: Daily
              # Team's per-env schema template (catalog.schema, with ${var.env} interpolation).
              schema: "{{DQ_SCHEMA_TEMPLATE}}"
              table: "{{DATASET}}"
              env: ${var.env}
              default_catalog: ${var.default_catalog}
              default_schema: ${var.default_schema}
          libraries:
            - jar: ${var.deequ_jar_path}        # Deequ JAR from UC Volume; see variables.yml
          job_cluster_key: job_cluster

      job_clusters:
        - job_cluster_key: job_cluster
          new_cluster: ${var.dqf_cluster}       # DBX-DAB-007 — ephemeral single-node cluster from clusters.yml
