id: dplc-discovery.case-01-behavior
skill: skills/dplc-discovery
type: behavior
description: >-
  Phase 2 (Discovery) orchestrator. Must run data discovery + profiling
  before generating documents (feasibility, requirements, business case,
  etc.) so artifacts are grounded in real schema/profile facts.
input:
