id: nfr-specification.case-01-happy-path
skill: skills/nfr-specification
type: artifact
description: 'Bootstrap happy-path case. Specify non-functional requirements: performance, scalability,
  reliability,

  observability, and cost constraints. Use when the user asks to "define the

  NFRs", "specify performance requirements", "document non-functional

  requirements", or "set the SLOs".'
input:
  arguments: Write the NFR specification for the employee directory data product. Hourly refresh, p99
    query < 2s, 99.9% availability.
structural_checks:
- non_empty_output
- no_placeholder_text
expected_template: skills/nfr-specification/templates/nfr-specification.md
rubric:
  threshold: 0.7
  criteria:
  - id: request_addressed
    weight: 0.4
    prompt: 'Does the output meaningfully address the request described by the skill: ''Specify non-functional
      requirements: performance, scalability, reliability,

      observability, and cost constraints. Use when the user asks to "''? Score 0-1.'
  - id: format_conformant
    weight: 0.4
    prompt: Does the output follow the structure the skill prescribes (sections, tables, fields, etc.)?
      Score 0-1.
  - id: no_placeholders
    weight: 0.2
    prompt: Output free of [TBD], [fill in], lorem-ipsum stubs, or empty cells where data was expected?
      Score 0-1.
