steps:
- id: step-1
  action:
    adapter: terminal
    session: developer
    command: python3 runtime/lab.py mutate . --drill missing-fx
    timeout_seconds: 600
  expect:
    exit_code: 0
    checks:
    - kind: file-present
      path: variation.json
  capture:
    context: DEV CONTAINER -> DATABRICKS / PORTFOLIO ANALYTICS
    hold_seconds: 2
  caption:
    action: Fail dated FX coverage and recover.
    notice: Real supplied holdings; independent grain/value evidence and explicit
      business dates. Observe actual output; installed versions and owned namespace
      are recorded outside secret sign-in.
