[pytest]
# Skill `templates/` directories hold scaffolding that is emitted into a
# generated data product, not tests of this repo. Two of them ship a
# test_*.py that asserts on paths like data_products/{{PRODUCT}}/databricks.yml
# — unexpanded placeholders that can only resolve inside a generated project,
# so collecting them here always fails. They are still covered:
# tests/skills/test_generate_dag_templates.py imports the template files by
# path and exercises them under mocks.
# This list restates pytest's defaults; setting norecursedirs replaces them.
norecursedirs = *.egg .* _darcs build CVS dist node_modules venv {arch} templates

markers =
    integration: Real-network tests requiring live service credentials (Jira, Databricks, etc.)
    unit: Fast tests with no external dependencies
