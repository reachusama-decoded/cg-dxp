doc_md: |
  ## daily_positions

  **Owner:** edo-platform@capgroup.com
  **xMatters group:** edo_ig_oncall (criticality: high)
  **Trigger:** Asset-driven on `raw_positions_ready` (RFD 0007).
  **Databricks job:** `{{ var.value.databricks_job_prefix }}daily_positions_job`
  (renders to `edo_prd_daily_positions_job` in prd; the bundle's
  `databricks_job_prefix` is the single source of truth for the deployed
  job name — see `bundle/resources/daily_positions.job.yml`).

  ### Local dev (RFD 0011 §6 — PY-AIRFLOW-021)

  ```
  astro dev start
  airflow tasks test investment_operations__daily_positions__daily run_databricks_job 2026-06-15
  ```

  Validate locally before pushing; CI is the safety net, not the inner loop.

  ### Rerun

  Pause the DAG, clear the affected logical date, then unpause. Writes are
  partition-keyed (RFD 0011 §1 — PY-AIRFLOW-001) so reruns are safe and idempotent.

  ### Alerting

  On failure, alerting is provided by Astronomer's platform Datadog
  integration — this DAG wires no on_failure_callback. The routing tags
  (`criticality`, `l1_xmatters_group`, `lifecycle_phase`, `l1_domain`,
  `data_classification`) are the context support reads to manually escalate
  to xMatters / notify Teams from the Datadog alert (RFD 0011 §6 —
  PY-AIRFLOW-008). No PagerDuty, no Slack, no automated paging from this DAG.
