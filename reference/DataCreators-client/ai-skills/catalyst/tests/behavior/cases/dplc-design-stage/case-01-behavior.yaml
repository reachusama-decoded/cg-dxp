id: dplc-design-stage.case-01-behavior
skill: skills/dplc-design-stage
type: behavior
description: >-
  Define stage orchestrator. Should run the four phase orchestrators in
  order: prereq → triage → discovery → design. Each phase orchestrator is
  a separate sub-skill and must be invoked sequentially.
input:
