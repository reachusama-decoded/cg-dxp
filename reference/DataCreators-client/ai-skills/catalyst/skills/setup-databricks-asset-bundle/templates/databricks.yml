      util_bucket: "{{SQA_UTIL_BUCKET}}"
      default_catalog: "{{SQA_DEFAULT_CATALOG}}"
      default_schema: "{{SQA_DEFAULT_SCHEMA}}"
      cluster_id: "{{SQA_CLUSTER_ID}}"
      caspian_catalog: "{{SQA_CASPIAN_CATALOG}}"
      app_catalog: "{{SQA_DR_APP_CATALOG}}"
      target_schema: "{{SQA_DR_TARGET_SCHEMA}}"
      checkpoint_table: "{{SQA_DR_APP_CATALOG}}.{{SQA_DR_CHECKPOINT_SCHEMA}}.{{CHECKPOINT_TABLE_NAME}}"
