      target_schema: "{{PRD_TARGET_SCHEMA}}"
      checkpoint_table: "{{PRD_APP_CATALOG}}.{{PRD_CHECKPOINT_SCHEMA}}.{{CHECKPOINT_TABLE_NAME}}"

  # DR variants use DR workspace + DR catalog/schema while inheriting the
