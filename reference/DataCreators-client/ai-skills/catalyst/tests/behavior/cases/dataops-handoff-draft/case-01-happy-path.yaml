id: dataops-handoff-draft.case-01-happy-path
skill: skills/dataops-handoff-draft
type: artifact
description: 'Bootstrap happy-path case. Draft the operational handoff package: compute, orchestration,
  monitoring,

  alerting, and on-call contacts. Use when the user asks to "create the

  handoff document", "draft the ops handoff", "document operational

  requirements", or "prepare the DataOps package".'
input:
  arguments: Draft the DataOps handoff for an employee directory data product (medallion pipeline, hourly
    schedule, alerts on freshness).
structural_checks:
- non_empty_output
- no_placeholder_text
expected_template: skills/dataops-handoff-draft/templates/dataops-handoff-draft.md
rubric:
  threshold: 0.7
  criteria:
  - id: request_addressed
    weight: 0.4
    prompt: 'Does the output meaningfully address the request described by the skill: ''Draft the operational
      handoff package: compute, orchestration, monitoring,

      alerting, and on-call contacts. Use when the user asks to "create''? Score 0-1.'
  - id: format_conformant
    weight: 0.4
    prompt: Does the output follow the structure the skill prescribes (sections, tables, fields, etc.)?
      Score 0-1.
  - id: no_placeholders
    weight: 0.2
    prompt: Output free of [TBD], [fill in], lorem-ipsum stubs, or empty cells where data was expected?
      Score 0-1.
