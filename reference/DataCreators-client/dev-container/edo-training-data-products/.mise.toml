[tasks."challenge:v2:airflow-evidence"]
description = "Check owned fresh scheduled Astro success/failure/repair and independent Portfolio output"
usage = '''
arg "<stage>"
flag "--success <success>" required=true
flag "--failure <failure>" required=true
flag "--repair <repair>" required=true
flag "--after <after>" required=true
'''
run = '''
set -e
python3 challenges/v2/runtime/portfolio/check-scheduled.py "${usage_stage?}" --success "${usage_success?}" --failure "${usage_failure?}" --repair "${usage_repair?}" --after "${usage_after?}"
'''
