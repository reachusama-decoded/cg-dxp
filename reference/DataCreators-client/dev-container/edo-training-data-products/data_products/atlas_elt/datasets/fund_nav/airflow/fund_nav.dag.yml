dag_id: atlas_elt_fund_nav
description: Run the Atlas ELT fund_nav dataset pipeline.
schedule: "@daily"
start_date: "2024-01-01"
catchup: false
tags:
  - atlas_elt
default_args:
  owner: EDO TRAINING

steps:
  run_fund_nav_dbt:
    blueprint: databricks_run_now
    job_name: "{{ var.value.get('databricks_job_prefix', '') }}fund_nav_job"
    databricks_conn_id: caspian-training-databricks

  run_fund_nav_dq:
    depends_on: [run_fund_nav_dbt]
    blueprint: databricks_run_now
    job_name: "{{ var.value.get('databricks_job_prefix', '') }}fund_nav_dq_job"
    databricks_conn_id: caspian-training-databricks

  mock_xcom_generator:
    depends_on: [run_fund_nav_dq]
    blueprint: mock_xcom
    domain: atlas_elt
    model: fund_nav

  notify_fund_nav:
    depends_on: [mock_xcom_generator]
    blueprint: kafka_notify
    xcom_pull_task: mock_xcom_generator
    model: fund_nav
    cluster_id: "{{ var.value.dev_cluster_id }}"
    python_file: "{{ var.value.root_path }}/files/data_products/{{ var.value.data_product_name }}/python/run_data_notify.py"
