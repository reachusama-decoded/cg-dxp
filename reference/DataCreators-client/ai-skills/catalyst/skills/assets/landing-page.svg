<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580">
  <foreignObject width="900" height="580">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }
        body, div {
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        }
        .root {
          width: 900px;
          height: 580px;
          overflow: hidden;
          background: #ffffff;
        }

        /* ── Hero ─────────────────────────────────────── */
        .hero {
          background: linear-gradient(160deg, #0F172A 0%, #1E293B 100%);
          padding: 28px 36px 22px;
        }
        .badge {
          display: inline-block;
          font-size: 10px;
          font-weight: 700;
          letter-spacing: 0.12em;
          text-transform: uppercase;
          color: #93C5FD;
          background: rgba(37, 99, 235, 0.18);
          border: 1px solid rgba(37, 99, 235, 0.35);
          border-radius: 20px;
          padding: 4px 12px;
          margin-bottom: 14px;
        }
        .hero-title {
          font-size: 32px;
          font-weight: 800;
          color: #F8FAFC;
          line-height: 1.15;
          letter-spacing: -0.5px;
          margin-bottom: 10px;
        }
        .hero-title .accent {
          /* CSS gradient text via background-clip */
          background: linear-gradient(90deg, #3B82F6 0%, #60A5FA 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
        }
        .hero-subtitle {
          font-size: 13.5px;
          color: #94A3B8;
          line-height: 1.55;
          max-width: 620px;
          margin-bottom: 20px;
        }

        /* ── Pipeline ─────────────────────────────────── */
        .pipeline {
          display: flex;
          align-items: center;
          gap: 0;
          flex-wrap: nowrap;
        }
        .phase {
          display: flex;
          align-items: center;
        }
        .phase-chip {
          font-size: 10px;
          font-weight: 600;
          padding: 4px 9px;
          border-radius: 5px;
          white-space: nowrap;
          letter-spacing: 0.02em;
        }
        .phase-chip.muted {
          color: #64748B;
          background: rgba(100, 116, 139, 0.12);
          border: 1px solid rgba(100, 116, 139, 0.22);
        }
        .phase-chip.active {
          color: #DBEAFE;
          background: rgba(37, 99, 235, 0.28);
          border: 1px solid rgba(59, 130, 246, 0.45);
        }
        .phase-arrow {
          color: #334155;
          font-size: 11px;
          padding: 0 4px;
          font-weight: 700;
        }

        /* ── Cards section ────────────────────────────── */
        .cards-section {
          background: #F8FAFC;
          padding: 24px 36px 24px;
          display: flex;
          gap: 18px;
        }
        .card {
          flex: 1;
          background: #ffffff;
          border: 1px solid #E2E8F0;
          border-radius: 10px;
          padding: 20px;
          display: flex;
          flex-direction: column;
          gap: 10px;
          position: relative;
          overflow: hidden;
        }
        .card.card-active {
          border-color: #BFDBFE;
          box-shadow: 0 0 0 1px rgba(37,99,235,0.08), 0 2px 12px rgba(37,99,235,0.07);
        }
        .card.card-muted {
          opacity: 0.72;
        }

        /* card top accent bar */
        .card-active::before {
          content: "";
          display: block;
          position: absolute;
          top: 0; left: 0; right: 0;
          height: 3px;
          background: linear-gradient(90deg, #2563EB, #60A5FA);
          border-radius: 10px 10px 0 0;
        }

        .card-header {
          display: flex;
          align-items: center;
          justify-content: space-between;
        }
        .card-title {
          font-size: 15px;
          font-weight: 800;
          letter-spacing: 0.03em;
          text-transform: uppercase;
          color: #0F172A;
        }
        .card-title.muted-title {
          color: #94A3B8;
        }
        .card-phases-badge {
          font-size: 10px;
          font-weight: 600;
          color: #64748B;
          background: #F1F5F9;
          border: 1px solid #E2E8F0;
          border-radius: 12px;
          padding: 2px 8px;
          white-space: nowrap;
        }
        .card-tagline {
          font-size: 12px;
          color: #475569;
          font-style: italic;
          line-height: 1.4;
        }
        .card-tagline.muted-tag {
          color: #94A3B8;
        }
        .divider {
          border: none;
          border-top: 1px solid #E2E8F0;
          margin: 2px 0;
        }

        /* skill count rows */
        .skill-count-row {
          display: flex;
          align-items: center;
          justify-content: space-between;
          font-size: 11.5px;
        }
        .skill-label {
          color: #64748B;
          display: flex;
          align-items: center;
          gap: 5px;
        }
        .dot {
          width: 6px;
          height: 6px;
          border-radius: 50%;
          flex-shrink: 0;
        }
        .dot-orch  { background: #2563EB; }
        .dot-exec  { background: #0891B2; }
        .dot-doc   { background: #059669; }
        .skill-count {
          font-weight: 700;
          font-size: 13px;
          color: #1E293B;
        }

        /* total row */
        .total-row {
          display: flex;
          align-items: center;
          justify-content: space-between;
          background: #EFF6FF;
          border-radius: 6px;
          padding: 7px 10px;
          margin-top: 2px;
        }
        .total-label {
          font-size: 11px;
          font-weight: 700;
          color: #2563EB;
          text-transform: uppercase;
          letter-spacing: 0.07em;
        }
        .total-count {
          font-size: 17px;
          font-weight: 800;
          color: #2563EB;
        }

        /* status badge */
        .status-badge {
          display: inline-flex;
          align-items: center;
          gap: 5px;
          font-size: 10px;
          font-weight: 700;
          letter-spacing: 0.06em;
          text-transform: uppercase;
          border-radius: 20px;
          padding: 4px 10px;
        }
        .status-badge.active-badge {
          color: #059669;
          background: rgba(5, 150, 105, 0.1);
          border: 1px solid rgba(5, 150, 105, 0.25);
        }
        .status-badge.amber-badge {
          color: #D97706;
          background: rgba(217, 119, 6, 0.08);
          border: 1px solid rgba(217, 119, 6, 0.22);
        }
        .dot-status {
          width: 5px;
          height: 5px;
          border-radius: 50%;
        }
        .dot-status.green { background: #059669; }
        .dot-status.amber { background: #D97706; }

        /* coming-soon placeholder */
        .coming-soon-body {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          flex: 1;
          gap: 8px;
          padding: 12px 0 4px;
        }
        .coming-soon-icon {
          font-size: 22px;
          opacity: 0.35;
        }
        .coming-soon-text {
          font-size: 11.5px;
          color: #94A3B8;
          text-align: center;
          font-weight: 500;
        }
      </style>

      <div class="root">

        <!-- ═══════════ HERO ═══════════ -->
        <div class="hero">
          <div class="hero-title">AI Catalyst <span class="accent">DPLC</span> Skills</div>
          <div class="hero-subtitle">AI-powered skills that accelerate the Data Product Lifecycle — from first request to production operation and retirement.</div>

          <!-- Phase pipeline -->
          <div class="pipeline">
            <div class="phase">
              <div class="phase-chip active">P0 Pre-req</div>
            </div>
            <div class="phase-arrow">›</div>
            <div class="phase">
              <div class="phase-chip active">P1 Triage</div>
            </div>
            <div class="phase-arrow">›</div>
            <div class="phase">
              <div class="phase-chip active">P2 Discovery</div>
            </div>
            <div class="phase-arrow">›</div>
            <div class="phase">
              <div class="phase-chip active">P3 Design</div>
            </div>
            <div class="phase-arrow">›</div>
            <div class="phase">
              <div class="phase-chip active">P4 Build</div>
            </div>
            <div class="phase-arrow">›</div>
            <div class="phase">
              <div class="phase-chip active">P5 Validate</div>
            </div>
            <div class="phase-arrow">›</div>
            <div class="phase">
              <div class="phase-chip active">P6 Publish</div>
            </div>
            <div class="phase-arrow">›</div>
            <div class="phase">
              <div class="phase-chip active">P7 Operate</div>
            </div>
            <div class="phase-arrow">›</div>
            <div class="phase">
              <div class="phase-chip active">P8 Evolve</div>
            </div>
          </div>
        </div>

        <!-- ═══════════ CARDS ═══════════ -->
        <div class="cards-section">

          <!-- DESIGN card -->
          <div class="card card-active">
            <div class="card-header">
              <div class="card-title">Design</div>
              <div class="card-phases-badge">Phases 0 – 3</div>
            </div>
            <div class="card-tagline">"What are we building and why?"</div>
            <hr class="divider" />
            <div class="skill-count-row">
              <div class="skill-label"><span class="dot dot-orch"></span>Orchestrators</div>
              <span class="skill-count">4</span>
            </div>
            <div class="skill-count-row">
              <div class="skill-label"><span class="dot dot-exec"></span>Execution</div>
              <span class="skill-count">5</span>
            </div>
            <div class="skill-count-row">
              <div class="skill-label"><span class="dot dot-doc"></span>Document</div>
              <span class="skill-count">20</span>
            </div>
            <div class="total-row">
              <span class="total-label">Total Skills</span>
              <span class="total-count">29</span>
            </div>
            <div>
              <span class="status-badge active-badge">
                <span class="dot-status green"></span>
                Live
              </span>
            </div>
          </div>

          <!-- BUILD card -->
          <div class="card card-active">
            <div class="card-header">
              <div class="card-title">Build</div>
              <div class="card-phases-badge">Phases 4 – 6</div>
            </div>
            <div class="card-tagline">"Build it and prove it works"</div>
            <hr class="divider" />
            <div class="skill-count-row">
              <div class="skill-label"><span class="dot dot-orch"></span>Orchestrators</div>
              <span class="skill-count">2</span>
            </div>
            <div class="skill-count-row">
              <div class="skill-label"><span class="dot dot-exec"></span>Execution</div>
              <span class="skill-count">17</span>
            </div>
            <div class="skill-count-row">
              <div class="skill-label"><span class="dot dot-doc"></span>Document</div>
              <span class="skill-count">7</span>
            </div>
            <div class="total-row">
              <span class="total-label">Total Skills</span>
              <span class="total-count">26</span>
            </div>
            <div>
              <span class="status-badge active-badge">
                <span class="dot-status green"></span>
                Live
              </span>
            </div>
          </div>

          <!-- SHIP card -->
          <div class="card card-active">
            <div class="card-header">
              <div class="card-title">Ship</div>
              <div class="card-phases-badge">Phases 7 – 8</div>
            </div>
            <div class="card-tagline">"Get it live and keep it healthy"</div>
            <hr class="divider" />
            <div class="skill-count-row">
              <div class="skill-label"><span class="dot dot-orch"></span>Orchestrators</div>
              <span class="skill-count">1</span>
            </div>
            <div class="skill-count-row">
              <div class="skill-label"><span class="dot dot-exec"></span>Execution</div>
              <span class="skill-count">0</span>
            </div>
            <div class="skill-count-row">
              <div class="skill-label"><span class="dot dot-doc"></span>Document</div>
              <span class="skill-count">10</span>
            </div>
            <div class="total-row">
              <span class="total-label">Total Skills</span>
              <span class="total-count">11</span>
            </div>
            <div>
              <span class="status-badge active-badge">
                <span class="dot-status green"></span>
                Live
              </span>
            </div>
          </div>

        </div>
      </div>

    </div>
  </foreignObject>
</svg>
