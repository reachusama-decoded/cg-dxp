      target_schema: "{{SQA_TARGET_SCHEMA}}"
      checkpoint_table: "{{SQA_APP_CATALOG}}.{{SQA_CHECKPOINT_SCHEMA}}.{{CHECKPOINT_TABLE_NAME}}"

  prd:
