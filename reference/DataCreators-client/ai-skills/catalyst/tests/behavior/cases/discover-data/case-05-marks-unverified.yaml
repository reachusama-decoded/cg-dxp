id: discover-data.case-05-marks-unverified
type: artifact
description: |
  PR #40, dimension 3 of 3: when Databricks is not configured, does
  the skill REFUSE to silently fabricate a schema — either by
  declining to produce concrete table content, or by marking any
  schema-dependent output as "inferred / not verified"? Shares
  run-03-no-databricks with case-03 and case-04.

run: discover-data.run-03-no-databricks

structural_checks:
  - non_empty_output

rubric:
  threshold: 0.7
  criteria:
    - id: marks_or_declines_unverified
      weight: 1.0
      prompt: |
        Either (a) the output declines to produce concrete table /
        schema content because it cannot verify against a live
        catalog, OR (b) any concrete table / schema content is
        explicitly marked as inferred / unverified (e.g., "Schema
        inferred — not verified against live catalog"). The skill
        must NOT silently fabricate Unity Catalog tables and present
        them as real. Score 0-1.
