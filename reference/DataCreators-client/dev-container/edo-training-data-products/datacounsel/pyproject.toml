[project]
name = "datacounsel"
dynamic = ["version"]
description = "Data contract management and export tooling"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Data Platform Team" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]


dependencies = [
    "datacontract-cli[databricks]", # this dependency is a bit heavy. see if we can replace it
    "databricks-sql-connector[pyarrow]"
]

[project.optional-dependencies]# Soda requires Python <3.13
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.3",
    "mypy>=1.8",
    "pre-commit>=3.6",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]

[[tool.uv.index]]
name = "internal-proxy"
url = "https://cgrepo-aws.capgroup.com/repository/cgpypi/simple/"

[project.scripts]
datacounsel = "datacounsel.main:app"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.version.raw-options]
version_scheme = "python-simplified-semver"

[tool.hatch.build.hooks.vcs]
version-file = "src/datacounsel/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/datacounsel"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
]

# Ruff configuration
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["datacounsel"]

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"

# MyPy configuration
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

# Coverage configuration
[tool.coverage.run]
source = ["src/datacounsel"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]