      kafka_secret_scope: "{{PRD_KAFKA_SECRET_SCOPE}}"
      kafka_secret_arn: "{{PRD_KAFKA_SECRET_ARN}}"
      rootca_secret_arn: "{{PRD_ROOTCA_SECRET_ARN}}"
      data_notify_topic: "{{PRD_DATA_NOTIFY_TOPIC}}"
      bootstrap_brokers: "{{PRD_MSK_BOOTSTRAP_BROKERS}}"
      schema_registry_url: "{{PRD_SCHEMA_REGISTRY_URL}}"
      zone_bucket: "{{PRD_ZONE_BUCKET}}"
      util_bucket: "{{PRD_UTIL_BUCKET}}"
      default_catalog: "{{PRD_DEFAULT_CATALOG}}"
