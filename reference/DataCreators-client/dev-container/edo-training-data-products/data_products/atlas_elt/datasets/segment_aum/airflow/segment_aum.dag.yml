dag_id: atlas_elt_segment_aum
description: Run the Atlas ELT segment_aum dataset pipeline.
schedule: "@daily"
start_date: "2024-01-01"
catchup: false
tags:
  - atlas_elt
default_args:
  owner: EDO TRAINING

steps:
  run_segment_aum_dbt:
    blueprint: databricks_run_now
    job_name: "{{ var.value.get('databricks_job_prefix', '') }}segment_aum_job"
    databricks_conn_id: caspian-training-databricks

  run_segment_aum_dq:
    depends_on: [run_segment_aum_dbt]
    blueprint: databricks_run_now
    job_name: "{{ var.value.get('databricks_job_prefix', '') }}segment_aum_dq_job"
    databricks_conn_id: caspian-training-databricks

  mock_xcom_generator:
    depends_on: [run_segment_aum_dq]
    blueprint: mock_xcom
    domain: atlas_elt
    model: segment_aum

  notify_segment_aum:
    depends_on: [mock_xcom_generator]
    blueprint: kafka_notify
    xcom_pull_task: mock_xcom_generator
    model: segment_aum
    cluster_id: "{{ var.value.dev_cluster_id }}"
    python_file: "{{ var.value.root_path }}/files/data_products/{{ var.value.data_product_name }}/python/run_data_notify.py"
