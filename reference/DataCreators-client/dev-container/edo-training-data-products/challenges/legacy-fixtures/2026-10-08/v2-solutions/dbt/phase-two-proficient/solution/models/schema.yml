version: 2
models:
  - name: stg_funds
    columns:
      - name: fund_id
        data_tests: [not_null, unique]
  - name: stg_holdings
    columns:
      - name: fund_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_funds')
                field: fund_id
  - name: fund_exposure
    columns:
      - name: fund_id
        data_tests: [not_null, unique]
